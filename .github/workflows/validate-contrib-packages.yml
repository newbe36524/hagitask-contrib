name: Validate Contrib Packages

on:
  pull_request:
    paths:
      - "data/**"
      - "test/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/validate-contrib-packages.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-packages:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contrib packages
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked toolchain
        run: pnpm install --frozen-lockfile

      - name: Verify install and lockfile stability
        run: |
          test -d node_modules
          git diff --exit-code -- pnpm-lock.yaml

      - name: Registry neutrality
        run: pnpm run check:registry

      - name: Validate contrib packages
        run: pnpm run validate

      - name: Run CLI smoke tests
        run: pnpm test
